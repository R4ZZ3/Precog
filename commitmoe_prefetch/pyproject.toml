[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commitmoe-prefetch"
version = "0.1.0"
description = "Learned next-token expert prefetch for MoE decode offloading (FreeToken --expert-predictor)"
license = "Apache-2.0"
requires-python = ">=3.10"
# torch and triton come with FreeToken; they are not pinned here so pip does not replace its build.
dependencies = ["pydantic>=2", "safetensors", "huggingface_hub"]

[tool.setuptools]
packages = ["commitmoe_prefetch"]
